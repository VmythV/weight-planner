[project]
name = "weight-planner"
version = "0.1.0"
description = "个人减重计划：体重秤数据 + 平滑计划曲线 + 每日热量建议"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
