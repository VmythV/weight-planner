# 复制为 secrets.yaml 后填写，secrets.yaml 不要提交到 git
wifi_ssid: "你的WiFi名"
wifi_password: "WiFi密码"
fallback_password: "至少8位的备用热点密码"
ota_password: "随便设一个OTA密码"
scale_bindkey: "00000000000000000000000000000000"   # 32 位十六进制 BLE KEY
scale_mac: "00:00:00:00:00:00"                      # 秤的蓝牙 MAC 地址
# 公网地址需要 HTTPS（固件会校验证书）；局域网也可以用 http://192.168.1.10:8765/api/weighins
report_url: "https://your-server.example.com/api/weighins"
api_token: "与服务器 .env 里 WP_API_TOKENS 的 esp32 令牌一致"
